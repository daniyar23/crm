<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <title>CRM Lite</title>

        <style>
            :root {
                --bg: #0b1020;
                --glass: rgba(255, 255, 255, 0.08);
                --border: rgba(255, 255, 255, 0.15);
                --text: #e5e7eb;
                --muted: #9ca3af;
                --primary: #6366f1;
                --danger: #ef4444;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                font-family:
                    system-ui,
                    -apple-system,
                    sans-serif;
                background:
                    radial-gradient(
                        900px 500px at 10% -10%,
                        #1e293b,
                        transparent
                    ),
                    radial-gradient(
                        800px 400px at 90% 10%,
                        #312e81,
                        transparent
                    ),
                    var(--bg);
                color: var(--text);
            }

            .container {
                max-width: 1000px;
                margin: 40px auto;
                padding: 24px;
            }

            h1 {
                text-align: center;
                font-size: 36px;
                margin-bottom: 40px;
            }

            .card {
                background: var(--glass);
                border: 1px solid var(--border);
                backdrop-filter: blur(16px);
                border-radius: 20px;
                padding: 22px;
                animation: fadeUp 0.4s ease;
            }

            @keyframes fadeUp {
                from {
                    opacity: 0;
                    transform: translateY(12px);
                }
                to {
                    opacity: 1;
                    transform: none;
                }
            }

            .grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 24px;
            }

            .stack > * + * {
                margin-top: 14px;
            }

            input,
            select,
            button {
                width: 100%;
                padding: 12px 14px;
                border-radius: 14px;
                border: 1px solid var(--border);
                background: rgba(255, 255, 255, 0.06);
                color: var(--text);
            }

            button {
                background: linear-gradient(135deg, #6366f1, #4f46e5);
                border: none;
                cursor: pointer;
                font-weight: 500;
                transition:
                    transform 0.15s ease,
                    opacity 0.15s ease;
            }

            button:hover {
                transform: translateY(-1px);
                opacity: 0.95;
            }

            button.danger {
                background: linear-gradient(135deg, #ef4444, #dc2626);
            }

            .section-title {
                font-size: 18px;
                color: var(--muted);
                margin-bottom: 12px;
            }

            /* ---- COMPANIES ---- */

            .company-header {
                font-size: 22px;
                margin-bottom: 16px;
            }

            .company-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 16px;
            }

            .company-card {
                background: rgba(255, 255, 255, 0.06);
                border: 1px solid var(--border);
                border-radius: 16px;
                padding: 16px;
                animation: fadeUp 0.3s ease;
                position: relative;
            }

            .company-card button {
                position: absolute;
                top: 10px;
                right: 10px;
                background: none;
                color: var(--danger);
                font-size: 18px;
            }

            /* ---- TOAST ---- */

            #toasts {
                position: fixed;
                top: 24px;
                right: 24px;
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .toast {
                padding: 14px 18px;
                border-radius: 14px;
                backdrop-filter: blur(12px);
                animation: slideIn 0.3s ease;
            }

            .toast.success {
                background: rgba(34, 197, 94, 0.85);
            }
            .toast.error {
                background: rgba(239, 68, 68, 0.85);
            }

            @keyframes slideIn {
                from {
                    opacity: 0;
                    transform: translateX(30px);
                }
                to {
                    opacity: 1;
                    transform: none;
                }
            }

            @media (max-width: 800px) {
                .grid {
                    grid-template-columns: 1fr;
                }
            }
        </style>
    </head>

    <body>
        <div id="toasts"></div>

        <div class="container">
            <h1>CRM Lite</h1>

            <div class="grid">
                <div class="card stack">
                    <div class="section-title">Создать пользователя</div>
                    <input id="userName" placeholder="Имя" />
                    <input id="userEmail" placeholder="Email" />
                    <button onclick="createUser()">Создать</button>
                </div>

                <div class="card stack">
                    <div class="section-title">Активный пользователь</div>
                    <select id="userSelect" onchange="onUserSelect()">
                        <option value="">— не выбран —</option>
                    </select>
                    <div id="activeUser" class="muted">Не выбран</div>
                    <button class="danger" onclick="deleteActiveUser()">
                        Удалить пользователя
                    </button>
                </div>
            </div>

            <div class="card stack" style="margin-top: 32px">
                <div id="companyTitle" class="company-header muted">
                    Выберите пользователя
                </div>

                <div class="stack">
                    <input id="companyName" placeholder="Название компании" />
                    <button onclick="createCompany()">Добавить компанию</button>
                </div>

                <div id="companies" class="company-grid"></div>
            </div>
        </div>

        <script>
            let users = [];
            let companies = [];
            let activeUser = null;

            const companiesEl = document.getElementById("companies");

            function toast(msg, type = "success") {
                const t = document.createElement("div");
                t.className = `toast ${type}`;
                t.innerText = msg;
                document.getElementById("toasts").appendChild(t);
                setTimeout(() => t.remove(), 3000);
            }

            /* USERS */

            async function loadUsers() {
                const r = await fetch("/api/users");
                users = await r.json();
                userSelect.innerHTML =
                    '<option value="">— не выбран —</option>';
                users.forEach((u) => {
                    const o = document.createElement("option");
                    o.value = u.id;
                    o.textContent = `${u.name} (${u.email})`;
                    userSelect.appendChild(o);
                });
            }

            async function createUser() {
                await fetch("/api/users", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        name: userName.value,
                        email: userEmail.value,
                    }),
                });
                userName.value = userEmail.value = "";
                toast("Пользователь создан");
                loadUsers();
            }

            function onUserSelect() {
                const id = +userSelect.value;
                activeUser = users.find((u) => u.id === id);
                if (!activeUser) {
                    companyTitle.innerText = "Выберите пользователя";
                    companiesEl.innerHTML = "";
                    return;
                }
                activeUser.innerHTML = `${activeUser.name}`;
                companyTitle.innerText = `Компании пользователя ${activeUser.name}`;
                loadCompanies();
            }

            async function deleteActiveUser() {
                if (!activeUser) return;
                if (!confirm("Удалить пользователя и его компании?")) return;
                await fetch(`/api/users/${activeUser.id}`, {
                    method: "DELETE",
                });
                toast("Пользователь удалён", "error");
                activeUser = null;
                loadUsers();
                companiesEl.innerHTML = "";
            }

            /* COMPANIES */

            async function loadCompanies() {
                const r = await fetch(`/api/companies/user/${activeUser.id}`);
                companies = await r.json();
                renderCompanies();
            }

            function renderCompanies() {
                companiesEl.innerHTML = "";
                if (!companies.length) {
                    companiesEl.innerHTML =
                        '<div class="muted">Компаний пока нет</div>';
                    return;
                }
                companies.forEach((c) => {
                    const div = document.createElement("div");
                    div.className = "company-card";
                    div.innerHTML = `
      <strong>${c.name}</strong>
      <button onclick="deleteCompany(${c.id})">✕</button>
    `;
                    companiesEl.appendChild(div);
                });
            }

            async function createCompany() {
                if (!activeUser) return;
                await fetch("/api/companies", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        name: companyName.value,
                        user_id: activeUser.id,
                    }),
                });
                companyName.value = "";
                toast("Компания добавлена");
                loadCompanies();
            }

            async function deleteCompany(id) {
                await fetch(`/api/companies/${id}`, { method: "DELETE" });
                toast("Компания удалена", "error");
                loadCompanies();
            }

            loadUsers();
        </script>
    </body>
</html>
