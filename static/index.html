<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <title>CRM Lite — Danik.dev</title>

        <style>
            :root {
                --bg: #0f172a;
                --card: rgba(255, 255, 255, 0.08);
                --border: rgba(255, 255, 255, 0.14);
                --text: #e5e7eb;
                --muted: #9ca3af;
                --primary: #6366f1;
                --danger: #ef4444;
                --success: #22c55e;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                font-family:
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    sans-serif;
                background:
                    radial-gradient(
                        1000px 500px at 10% -10%,
                        #1e293b,
                        transparent
                    ),
                    radial-gradient(
                        800px 400px at 90% 10%,
                        #312e81,
                        transparent
                    ),
                    var(--bg);
                color: var(--text);
            }

            .container {
                max-width: 960px;
                margin: 40px auto;
                padding: 24px;
            }

            h1 {
                text-align: center;
                font-size: 34px;
                margin-bottom: 32px;
            }

            h2 {
                font-size: 18px;
                margin-bottom: 12px;
            }

            .grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 24px;
            }

            .card {
                background: var(--card);
                border: 1px solid var(--border);
                backdrop-filter: blur(16px);
                border-radius: 18px;
                padding: 20px;
                animation: fadeUp 0.35s ease;
            }

            @keyframes fadeUp {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .stack > * + * {
                margin-top: 12px;
            }

            input,
            select,
            button {
                width: 100%;
                padding: 12px 14px;
                border-radius: 12px;
                font-size: 14px;
                border: 1px solid var(--border);
                background: rgba(255, 255, 255, 0.06);
                color: var(--text);
            }

            button {
                background: linear-gradient(135deg, #6366f1, #4f46e5);
                border: none;
                cursor: pointer;
                font-weight: 500;
                transition:
                    transform 0.15s ease,
                    opacity 0.15s ease;
            }

            button:hover {
                transform: translateY(-1px);
                opacity: 0.95;
            }
            button:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }

            button.danger {
                background: linear-gradient(135deg, #ef4444, #dc2626);
            }

            ul {
                list-style: none;
                padding: 0;
                margin: 0;
            }

            li {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 10px 0;
                border-bottom: 1px solid var(--border);
                animation: fadeUp 0.25s ease;
            }

            li:last-child {
                border-bottom: none;
            }

            .delete-btn {
                background: none;
                border: none;
                color: var(--danger);
                font-size: 18px;
                cursor: pointer;
            }

            .muted {
                color: var(--muted);
            }

            footer {
                margin-top: 32px;
                text-align: center;
                font-size: 13px;
                color: var(--muted);
            }

            /* ---------- TOASTS ---------- */
            #toasts {
                position: fixed;
                top: 24px;
                right: 24px;
                display: flex;
                flex-direction: column;
                gap: 12px;
                z-index: 1000;
            }

            .toast {
                min-width: 260px;
                padding: 14px 16px;
                border-radius: 12px;
                backdrop-filter: blur(12px);
                color: white;
                animation: toastIn 0.3s ease forwards;
            }

            .toast.success {
                background: rgba(34, 197, 94, 0.85);
            }
            .toast.error {
                background: rgba(239, 68, 68, 0.85);
            }

            @keyframes toastIn {
                from {
                    opacity: 0;
                    transform: translateX(30px);
                }
                to {
                    opacity: 1;
                    transform: translateX(0);
                }
            }

            @media (max-width: 800px) {
                .grid {
                    grid-template-columns: 1fr;
                }
            }
        </style>
    </head>

    <body>
        <div id="toasts"></div>

        <div class="container">
            <h1>CRM Lite</h1>

            <div class="grid">
                <div class="card stack">
                    <h2>Создать пользователя</h2>
                    <input id="userName" placeholder="Имя" />
                    <input id="userEmail" placeholder="Email" />
                    <button onclick="createUser()">Создать</button>
                </div>

                <div class="card stack">
                    <h2>Активный пользователь</h2>
                    <select id="userSelect" onchange="onUserSelect()">
                        <option value="">— не выбран —</option>
                    </select>
                    <div id="activeUser" class="muted">Не выбран</div>
                    <button class="danger" onclick="deleteActiveUser()">
                        Удалить пользователя
                    </button>
                </div>
            </div>

            <div class="card stack" style="margin-top: 24px">
                <h2>Компании</h2>
                <input id="companyName" placeholder="Название компании" />
                <button onclick="createCompany()">Добавить компанию</button>
                <ul id="companies">
                    <li class="muted">Пользователь не выбран</li>
                </ul>
            </div>

            <footer>made with ☕ by danik.dev</footer>
            <footer>github.com/daniyar23</footer>
        </div>

        <script>
            let users = [],
                companies = [],
                activeUserId = null;

            /* ---------- TOAST ---------- */
            function toast(msg, type = "success") {
                const t = document.createElement("div");
                t.className = `toast ${type}`;
                t.innerText = msg;
                document.getElementById("toasts").appendChild(t);
                setTimeout(() => t.remove(), 3000);
            }

            /* ---------- USERS ---------- */
            async function loadUsers() {
                const r = await fetch("/api/users");
                users = await r.json();
                userSelect.innerHTML =
                    '<option value="">— не выбран —</option>';
                users.forEach((u) => {
                    const o = document.createElement("option");
                    o.value = u.id;
                    o.textContent = `${u.name} (${u.email})`;
                    userSelect.appendChild(o);
                });
            }

            async function createUser() {
                await fetch("/api/users", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        name: userName.value,
                        email: userEmail.value,
                    }),
                });
                userName.value = userEmail.value = "";
                toast("Пользователь создан");
                loadUsers();
            }

            function onUserSelect() {
                const id = +userSelect.value;
                if (!id) {
                    activeUserId = null;
                    activeUser.innerText = "Не выбран";
                    renderCompanies();
                    return;
                }
                activeUserId = id;
                const u = users.find((x) => x.id === id);
                activeUser.innerText = `${u.name}\n${u.email}\nID: ${u.id}`;
                renderCompanies();
            }

            async function deleteActiveUser() {
                if (!activeUserId) return;
                if (!confirm("Удалить пользователя и его компании?")) return;
                await fetch(`/api/users/${activeUserId}`, { method: "DELETE" });
                toast("Пользователь удалён", "error");
                activeUserId = null;
                loadUsers();
                loadCompanies();
            }

            /* ---------- COMPANIES ---------- */
            async function loadCompanies() {
                const r = await fetch("/api/companies");
                companies = await r.json();
                renderCompanies();
            }

            function renderCompanies() {
                companiesEl = companies.filter(
                    (c) => c.user_id === activeUserId,
                );
                companies.innerHTML = "";
                if (!activeUserId) {
                    companies.innerHTML =
                        '<li class="muted">Пользователь не выбран</li>';
                    return;
                }
                if (!companiesEl.length) {
                    companies.innerHTML = '<li class="muted">Компаний нет</li>';
                    return;
                }
                companiesEl.forEach((c) => {
                    const li = document.createElement("li");
                    li.innerHTML = `<span>${c.name}</span><button class="delete-btn" onclick="deleteCompany(${c.id})">✕</button>`;
                    companies.appendChild(li);
                });
            }

            async function createCompany() {
                if (!activeUserId) return;
                await fetch("/api/companies", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        name: companyName.value,
                        user_id: activeUserId,
                    }),
                });
                companyName.value = "";
                toast("Компания добавлена");
                loadCompanies();
            }

            async function deleteCompany(id) {
                await fetch(`/api/companies/${id}`, { method: "DELETE" });
                toast("Компания удалена", "error");
                loadCompanies();
            }

            loadUsers();
            loadCompanies();
        </script>
    </body>
</html>
